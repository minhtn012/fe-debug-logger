<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>FE Debug Logger</h1>
    <div id="status" class="status idle">Idle</div>
    <div class="controls">
      <button id="toggleBtn" class="btn btn-start">Start</button>
      <button id="copyBtn" class="btn btn-copy" disabled>Copy</button>
      <button id="exportBtn" class="btn btn-export" disabled>Export</button>
      <button id="clearBtn" class="btn btn-clear" disabled>Clear</button>
    </div>
    <div class="tools">
      <button id="annotateBtn" class="btn btn-annotate">Annotate <kbd id="annotateKey" class="kbd" hidden></kbd></button>
      <div class="screenshot-group">
        <button id="screenshotBtn" class="btn btn-screenshot">Screenshot &#x25BE;</button>
        <div id="screenshotMenu" class="dropdown-menu hidden">
          <button id="ssFullPage" class="dropdown-item">Full Page</button>
          <button id="ssRegion" class="dropdown-item">Select Region</button>
        </div>
      </div>
    </div>
    <div class="feedback">
      <button id="feedbackBtn" class="btn btn-feedback" disabled>Feedback</button>
      <button id="feedbackReviewBtn" class="btn btn-feedback-review">Xem feedback</button>
      <div id="feedbackStatus" class="feedback-status"></div>
    </div>
    <div class="options">
      <label><input type="checkbox" id="optConsole" checked> Console Errors</label>
      <label><input type="checkbox" id="optUserActions" checked> User Actions</label>
      <label><input type="checkbox" id="optNetwork" checked> Network</label>
      <label><input type="checkbox" id="optComponentState" checked> Component State</label>
    </div>
    <div id="entryCount" class="entry-count"></div>
    <div id="annotationCount" class="entry-count"></div>
    <div class="shortcuts">
      <div class="shortcuts-head">
        <span>Phím tắt</span>
        <button id="shortcutsEditBtn" class="link-btn">Đổi phím</button>
      </div>
      <div class="shortcut-row"><span>Annotate element</span><kbd class="kbd" data-cmd="toggle-annotate"></kbd></div>
      <div class="shortcut-row"><span>Thoát chế độ chọn</span><kbd class="kbd">Esc</kbd></div>
      <p class="shortcuts-tip">Element nằm trong menu hay dropdown đang mở: dùng phím tắt. Bấm icon extension sẽ làm menu đóng.</p>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
